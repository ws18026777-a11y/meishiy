<!DOCTYPE html>
<html>
<head>
    <title>卡密管理后台</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta charset="UTF-8">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background:#0d0d1a; color:#e0e0e0; padding:20px; min-height:100vh; }
        .container { max-width:1000px; margin:0 auto; }
        h1 { color:#4361ee; font-size:24px; margin-bottom:6px; }
        .subtitle { color:#666; font-size:13px; margin-bottom:20px; }
        .card { background:#1a1a2e; border-radius:12px; padding:20px; margin-bottom:16px; border:1px solid #2a2a4a; }
        .card h3 { color:#90EE90; font-size:16px; margin-bottom:12px; }
        .card h3 .badge { font-size:11px; color:#666; font-weight:normal; }
        .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
        .row input, .row select { padding:10px 12px; border-radius:6px; border:1px solid #333; background:#111; color:#fff; font-size:13px; flex:1; min-width:120px; }
        .row input:focus, .row select:focus { border-color:#4361ee; outline:none; }
        .row input::placeholder { color:#555; }
        .row button { padding:10px 24px; border:none; border-radius:6px; background:#4361ee; color:#fff; font-size:13px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .row button:hover { background:#5a7bff; }
        .row button.green { background:#2ecc71; color:#000; }
        .row button.green:hover { background:#3ddc84; }
        .row button.red { background:#e74c3c; }
        .row button.red:hover { background:#c0392b; }
        .row button.gray { background:#444; }
        .row button.gray:hover { background:#555; }
        .row button:disabled { opacity:0.5; cursor:not-allowed; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { padding:10px 8px; text-align:left; border-bottom:1px solid #2a2a4a; }
        th { color:#888; font-weight:normal; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
        td { word-break:break-all; }
        .status-ok { color:#90EE90; }
        .status-expired { color:#e74c3c; }
        .status-unbound { color:#f1c40f; }
        .tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; background:#4361ee; color:#fff; }
        .tag.permanent { background:#2ecc71; color:#000; }
        .tag.expired { background:#e74c3c; color:#fff; }
        .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .actions button { padding:4px 10px; border:none; border-radius:4px; font-size:11px; cursor:pointer; transition:all 0.2s; }
        .actions .del { background:#e74c3c; color:#fff; }
        .actions .del:hover { background:#c0392b; }
        .actions .copy { background:#4361ee; color:#fff; }
        .actions .copy:hover { background:#5a7bff; }
        .actions .unbind { background:#f39c12; color:#fff; }
        .actions .unbind:hover { background:#e67e22; }
        .json-box { background:#0d0d1a; padding:16px; border-radius:6px; font-family:monospace; font-size:11px; overflow:auto; max-height:350px; white-space:pre-wrap; word-break:break-all; border:1px solid #2a2a4a; margin-top:10px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2ecc71; color:#000; padding:12px 28px; border-radius:8px; font-weight:bold; font-size:14px; display:none; z-index:999; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
        .toast.error { background:#e74c3c; color:#fff; }
        .toast.show { display:block; animation:fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        .empty { color:#555; text-align:center; padding:30px 0; }
        .token-input { flex:2; min-width:200px; }
        .token-input input { width:100%; }
        .hint { color:#555; font-size:11px; margin-top:4px; }
        .hint a { color:#4361ee; }
        .stats { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px; }
        .stats span { color:#888; font-size:12px; }
        .stats strong { color:#fff; }
        @media (max-width:600px) { .row { flex-direction:column; } .row input, .row select { min-width:100%; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 卡密管理后台</h1>
    <div class="subtitle">管理你的 cards.json · 数据存储在 GitHub</div>

    <!-- Token 配置 -->
    <div class="card">
        <h3>🔑 GitHub 配置</h3>
        <div class="row">
            <div class="token-input">
                <input type="password" id="tokenInput" placeholder="请输入 GitHub Personal Access Token (repo权限)">
            </div>
            <button id="loadBtn" class="green">📥 加载数据</button>
            <button id="saveBtn" class="green">💾 保存到GitHub</button>
        </div>
        <div class="hint">
            💡 Token 只在本地使用，不会上传 ·
            <a href="https://github.com/settings/tokens" target="_blank">去生成Token</a>
            （需要勾选 repo 权限）
        </div>
    </div>

    <!-- 添加卡密 -->
    <div class="card">
        <h3>➕ 添加卡密</h3>
        <div class="row">
            <input type="text" id="cardId" placeholder="卡密 (如 ABC123)" style="flex:0.8;">
            <select id="cardType" style="flex:0.6;">
                <option value="体验卡">体验卡</option>
                <option value="周卡">周卡</option>
                <option value="月卡">月卡</option>
                <option value="季卡">季卡</option>
                <option value="永久" selected>永久</option>
            </select>
            <input type="date" id="cardExpire" style="flex:0.6;">
            <input type="text" id="cardDevice" placeholder="设备ID (留空则未绑定)" style="flex:1.2;">
            <button id="addBtn">➕ 添加</button>
        </div>
        <div class="hint">💡 设备ID留空 = 未绑定，用户验证时会提示联系管理员绑定</div>
    </div>

    <!-- 卡密列表 -->
    <div class="card">
        <h3>📋 卡密列表 <span class="badge" id="count"></span></h3>
        <div class="stats">
            <span>总计: <strong id="totalCount">0</strong></span>
            <span>已绑定: <strong id="boundCount">0</strong></span>
            <span>未绑定: <strong id="unboundCount">0</strong></span>
            <span>已过期: <strong id="expiredCount">0</strong></span>
        </div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr><th>卡密</th><th>类型</th><th>到期</th><th>设备ID</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="empty">请先点击「加载数据」</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- JSON 预览 -->
    <div class="card">
        <h3>📄 JSON 预览</h3>
        <div class="row">
            <button id="copyJsonBtn" class="gray">📋 复制JSON</button>
            <button id="refreshBtn" class="gray">🔄 刷新</button>
        </div>
        <div class="json-box" id="jsonOutput">等待加载...</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 配置
// ============================================================

var REPO_OWNER = 'ws18026777-a11y';
var REPO_NAME = 'meishiy';
var FILE_PATH = 'cards.json';
var BRANCH = 'main';

var currentData = { keys: {} };
var currentSha = '';
var token = '';

// ============================================================
// 工具
// ============================================================

function getToday() {
    return new Date().toISOString().split('T')[0];
}

function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            showToast('✅ 已复制');
        }).catch(function() { fallbackCopy(text); });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('✅ 已复制'); } catch(e) { showToast('复制失败', true); }
    document.body.removeChild(ta);
}

// ============================================================
// GitHub API
// ============================================================

function loadFromGitHub() {
    var token = document.getElementById('tokenInput').value.trim();
    if (!token) { showToast('请先输入 GitHub Token', true); return Promise.reject('No token'); }
    
    return fetch('https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH, {
        headers: { 'Authorization': 'token ' + token }
    })
    .then(function(res) {
        if (!res.ok) {
            if (res.status === 401) throw new Error('Token 无效或没有 repo 权限');
            if (res.status === 404) throw new Error('文件不存在，请确认仓库和路径正确');
            throw new Error('HTTP ' + res.status);
        }
        return res.json();
    })
    .then(function(data) {
        currentSha = data.sha;
        var content = atob(data.content);
        var json = JSON.parse(content);
        currentData = json;
        return json;
    });
}

function saveToGitHub(data) {
    var token = document.getElementById('tokenInput').value.trim();
    if (!token) { showToast('请先输入 GitHub Token', true); return Promise.reject('No token'); }
    
    // 修复中文乱码：用 TextEncoder 确保 UTF-8
    var content = JSON.stringify(data, null, 2);
    var encoder = new TextEncoder();
    var dataBytes = encoder.encode(content);
    var encoded = btoa(String.fromCharCode.apply(null, dataBytes));
    
    return fetch('https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH, {
        method: 'PUT',
        headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: '更新卡密数据 - ' + new Date().toLocaleString(),
            content: encoded,
            sha: currentSha,
            branch: BRANCH
        })
    })
    .then(function(res) {
        if (!res.ok) {
            if (res.status === 401) throw new Error('Token 无效或权限不足');
            throw new Error('HTTP ' + res.status);
        }
        return res.json();
    })
    .then(function(data) {
        currentSha = data.content.sha;
        showToast('✅ 保存成功！');
        return data;
    });
}

// ============================================================
// 渲染
// ============================================================

function renderTable() {
    var keys = currentData.keys || {};
    var tbody = document.getElementById('tableBody');
    var ids = Object.keys(keys);
    var today = getToday();
    
    document.getElementById('totalCount').textContent = ids.length;
    
    var bound = 0, unbound = 0, expired = 0;
    ids.forEach(function(id) {
        var card = keys[id];
        if (card.device && card.device !== '') bound++;
        else unbound++;
        if (card.expire !== '永久' && today > card.expire) expired++;
    });
    document.getElementById('boundCount').textContent = bound;
    document.getElementById('unboundCount').textContent = unbound;
    document.getElementById('expiredCount').textContent = expired;
    document.getElementById('count').textContent = '（共 ' + ids.length + ' 个）';
    
    if (ids.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无卡密，添加一个吧</td></tr>';
        updateJsonOutput();
        return;
    }
    
    var html = '';
    for (var id in keys) {
        var card = keys[id];
        var isBound = card.device && card.device !== '';
        var isExpired = card.expire !== '永久' && today > card.expire;
        
        var statusText, statusClass;
        if (!isBound) { statusText = '未绑定'; statusClass = 'status-unbound'; }
        else if (isExpired) { statusText = '已过期'; statusClass = 'status-expired'; }
        else { statusText = '✅ 有效'; statusClass = 'status-ok'; }
        
        var typeTag = '<span class="tag' + (card.type === '永久' ? ' permanent' : '') + '">' + card.type + '</span>';
        if (isExpired) typeTag += ' <span class="tag expired">过期</span>';
        
        html += '<tr>';
        html += '<td><strong style="font-family:monospace;">' + id + '</strong></td>';
        html += '<td>' + typeTag + '</td>';
        html += '<td>' + card.expire + '</td>';
        html += '<td style="font-family:monospace;font-size:11px;max-width:180px;word-break:break-all;">' + (card.device || '<span style="color:#555;">未绑定</span>') + '</td>';
        html += '<td class="' + statusClass + '">' + statusText + '</td>';
        html += '<td><div class="actions">';
        html += '<button class="del" onclick="deleteCard(\'' + id + '\')">🗑️</button>';
        if (card.device) {
            html += '<button class="copy" onclick="copyText(\'' + card.device + '\')">📋</button>';
            html += '<button class="unbind" onclick="unbindCard(\'' + id + '\')">解绑</button>';
        }
        html += '</div></td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
    updateJsonOutput();
}

function updateJsonOutput() {
    document.getElementById('jsonOutput').textContent = JSON.stringify(currentData, null, 2);
}

// ============================================================
// 操作
// ============================================================

window.deleteCard = function(id) {
    if (!confirm('确定删除卡密 ' + id + ' 吗？')) return;
    delete currentData.keys[id];
    renderTable();
    showToast('已删除: ' + id + '，记得点击「保存到GitHub」同步！');
};

window.unbindCard = function(id) {
    if (!confirm('解绑 ' + id + ' 的设备？')) return;
    currentData.keys[id].device = '';
    renderTable();
    showToast('✅ 已解绑，记得点击「保存到GitHub」同步！');
};

function addCard() {
    var id = document.getElementById('cardId').value.trim().toUpperCase();
    var type = document.getElementById('cardType').value;
    var expire = document.getElementById('cardExpire').value;
    var device = document.getElementById('cardDevice').value.trim();
    
    if (!id) { showToast('请输入卡密', true); return; }
    if (type !== '永久' && !expire) { showToast('请选择到期日期', true); return; }
    if (currentData.keys[id]) { showToast('卡密已存在！', true); return; }
    
    currentData.keys[id] = {
        type: type,
        expire: type === '永久' ? '永久' : expire,
        device: device || ''
    };
    
    document.getElementById('cardId').value = '';
    document.getElementById('cardDevice').value = '';
    renderTable();
    showToast('✅ 已添加: ' + id + '，记得点击「保存到GitHub」同步！');
}

// ============================================================
// 事件绑定
// ============================================================

document.getElementById('loadBtn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '加载中...';
    loadFromGitHub()
        .then(function() {
            renderTable();
            showToast('✅ 加载成功！共 ' + Object.keys(currentData.keys).length + ' 个卡密');
        })
        .catch(function(err) {
            showToast('❌ ' + err.message, true);
        })
        .finally(function() {
            btn.disabled = false;
            btn.textContent = '📥 加载数据';
        });
});

document.getElementById('saveBtn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '保存中...';
    saveToGitHub(currentData)
        .then(function() {
            showToast('✅ 保存成功！');
        })
        .catch(function(err) {
            showToast('❌ ' + err.message, true);
        })
        .finally(function() {
            btn.disabled = false;
            btn.textContent = '💾 保存到GitHub';
        });
});

document.getElementById('addBtn').addEventListener('click', addCard);

document.getElementById('cardId').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
});

document.getElementById('cardDevice').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
});

document.getElementById('cardType').addEventListener('change', function() {
    var expireInput = document.getElementById('cardExpire');
    if (this.value === '永久') {
        expireInput.disabled = true;
        expireInput.value = '';
    } else {
        expireInput.disabled = false;
        if (!expireInput.value) expireInput.value = getToday();
    }
});

document.getElementById('copyJsonBtn').addEventListener('click', function() {
    copyText(JSON.stringify(currentData, null, 2));
});

document.getElementById('refreshBtn').addEventListener('click', function() {
    renderTable();
    showToast('已刷新');
});

// 初始化日期
document.getElementById('cardExpire').value = getToday();

console.log('🔐 卡密管理后台已加载');
console.log('📌 仓库: ' + REPO_OWNER + '/' + REPO_NAME);
console.log('📄 文件: ' + FILE_PATH);
</script>
</body>
</html>
